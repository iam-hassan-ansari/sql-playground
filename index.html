<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQL Playground — Showroom DB (Demo)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="topbar">
    <div class="brand">🗄️ SQL Playground <span class="badge">DEMO</span></div>
    <div class="muted" id="engine-status">Loading SQLite engine…</div>
  </div>

  <div class="container">
    <div class="card">
      <h3>AutoBill Showroom Database</h3>
      <p class="muted">A sample SQLite database — <code>customers</code>, <code>vehicles</code>, <code>sales</code> — running entirely in your browser via <a href="https://sql.js.org/" target="_blank" rel="noopener">sql.js</a> (SQLite compiled to WebAssembly). Nothing is sent to a server.</p>

      <div class="example-chips" id="example-chips"></div>

      <textarea id="sql-input" rows="6" spellcheck="false">SELECT * FROM vehicles;</textarea>
      <div class="form-row">
        <button id="btn-run">Run Query (Ctrl+Enter)</button>
        <button class="secondary" id="btn-reset">Reset Database</button>
      </div>

      <div id="query-error" class="error-box" style="display:none;"></div>
      <div id="result-area"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>Schema</h3>
      <div class="schema-grid" id="schema-grid"></div>
    </div>
  </div>

  <div class="app-footer">
    Demo project by <strong>Hassan Ansari</strong> ·
    <a href="https://github.com/iam-hassan-ansari" target="_blank" rel="noopener">GitHub</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="app.js"></script>
</body>
</html>
